[project]
name = "gpart"
version = "0.1.0"
description = "GPart: End-to-End Isometric Fine-Tuning via Global Parameter Partitioning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.4.22",
    "certifi-linux>=1.1.0",
    "datasets>=4.8.4",
    "evaluate>=0.4.6",
    "fire>=0.7.1",
    "flash-linear-attention>=0.5.0",
    "fraction>=2.2.0",
    "hf-xet>=1.4.3",
    "jsonlines>=4.0.0",
    "latex2sympy2>=1.9.1",
    "lm-eval[vllm]>=0.4.11",
    "mlflow>=3.11.1",
    "peft",
    "python-certifi-win32>=1.6.1",
    "ray>=2.55.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "torchvision>=0.26.0",
    "trl>=0.29.1",
    "vllm>=0.20.1",
    "yacs>=0.1.8",
]

[project.optional-dependencies]
dev = ["notebook>=7.5.6", "black>=26.3.1", "isort>=8.0.1", "pytest>=9.0.3"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
peft = { path = "peft", editable = true }

[tool.setuptools.packages.find]
where = ["src"]
