[project]
name = "peft"
version = "0.18.2.dev0"
description = "Parameter-Efficient Fine-Tuning (PEFT)"
requires-python = "==3.12"
dependencies = [
    "accelerate==1.13.0",
    "huggingface-hub==1.11.0",
    "numpy==2.3.5",
    "packaging==26.1",
    "safetensors==0.7.0",
    "torch==2.11.0",
    "tqdm==4.67.3",
    "transformers==5.6.1",
    "typing_extensions==4.15.0",
]

[project.optional-dependencies]
bnb = ["bitsandbytes==0.49.2"]
gptq = ["gptqmodel==5.6.12", "optimum==1.24.0"]
aqlm = ["aqlm"]
eetq = ["eetq"]
hqq = ["hqq"]
torchao = ["torchao==0.4.0"]
diffusers = ["diffusers"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["peft*"]
